name: Capability drift

# Three things about this package rot on their own, with no commit to hang a check off.
#
#   * The runtime moves. This package implements TLS in JavaScript because nothing on workerd can
#     hand a TLS handshake an already-open socket, which is what a proxy CONNECT tunnel is. That is
#     a statement about a platform Cloudflare is actively filling in, not a law. The wrong way to
#     find out it has changed is not to.
#   * The trust anchors go stale. Roots added upstream are ones this package rejects and browsers
#     accept; roots distrusted upstream are ones this package still trusts.
#   * The package's own interop can break under it — a proxy, a TLS stack, a certificate chain
#     somewhere changes and the code that was correct yesterday is not.
#
# A failure here is often good news and is never, on its own, a regression in this package.
#
# Every Worker this workflow needs is deployed per run under a run-scoped name and deleted in an
# `if: always()` step, so a failed test still cleans up and two concurrent runs cannot collide.
# Nothing is left deployed between runs, which also removes the possibility of testing a
# months-old deployment and calling it "no drift".
#
# Never triggered by pull_request: fork PRs cannot read secrets, and a job that appears to check
# something while having no credentials is worse than no job.
#
# Secrets required:
#   CLOUDFLARE_API_TOKEN   scoped to Workers Scripts: Edit — nothing else
#   CLOUDFLARE_ACCOUNT_ID
#   TUNNELFETCH_PROXY      host:port:user:pass of a proxy you control. Needed ONLY by the edge job,
#                          and only by the parts of it that exercise CONNECT and SOCKS5 tunnelling:
#                          those require a proxy the Cloudflare edge can reach, and a runner has no
#                          inbound public address, so CI cannot stand one up for itself. The
#                          trust-layer job needs no secret at all — it dials the misconfigured hosts
#                          directly through this package's own TLS stack.
# The rigs' own shared secret is generated per run rather than stored: it guards a Worker that
# exists for a few minutes, so a long-lived secret would be a worse trade.

on:
  schedule:
    # 07:00 UTC on the 1st. Monthly matches how fast the things being watched actually move.
    - cron: '0 7 1 * *'
  workflow_dispatch:

jobs:
  edge:
    # Everything that needs the package running on the runtime it targets.
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROBE_NAME: tf-ci-probe-${{ github.run_id }}-${{ github.run_attempt }}
      LIVE_NAME: tf-ci-live-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci

      - name: generate a per-run rig token
        # ::add-mask:: because a value put into $GITHUB_ENV is not a repository secret and GitHub
        # will not redact it — the first run printed this token in cleartext in the step's env
        # dump. It guards a Worker that lives for a few minutes, but the log outlives it, and if
        # cleanup ever fails it guards a live one.
        run: |
          T=$(openssl rand -hex 16)
          echo "::add-mask::$T"
          echo "PROBE_TOKEN=$T" >> "$GITHUB_ENV"

      # deploy-probe.mjs bakes a hash of the rig's own source into the deployment, which the drift
      # test asserts against the checkout. Here it always matches — the point of deploying per run —
      # but the same script serves a human deploying by hand, where it does not.
      - name: deploy the capability probe
        run: |
          node scripts/deploy-probe.mjs --dir probe --name "$PROBE_NAME" \
            --var "PROBE_TOKEN:$PROBE_TOKEN" | tee /tmp/probe.log
          grep -oP '(?<=DEPLOYED_URL=).*' /tmp/probe.log | tail -1 \
            | sed 's/^/PROBE_URL=/' >> "$GITHUB_ENV"

      - name: deploy the interop rig
        run: |
          node scripts/deploy-probe.mjs --dir live --name "$LIVE_NAME" \
            --var "PROBE_TOKEN:$PROBE_TOKEN" | tee /tmp/live.log
          grep -oP '(?<=DEPLOYED_URL=).*' /tmp/live.log | tail -1 \
            | sed 's/^/LIVE_URL=/' >> "$GITHUB_ENV"

      # A deploy is not serving the instant wrangler returns, and it does not become available
      # everywhere at once: workers.dev propagates across the edge node by node. The first run
      # failed on a request sent 125 ms after deploying; the second failed differently and more
      # instructively — alternating passes and 404s, every 404 answered in under 20 ms because
      # there was no Worker at that node to run, every success taking hundreds. Waiting for ONE
      # 200 only proves the node that happened to answer has it.
      #
      # So require a run of consecutive successes, which is weak evidence per probe but strong
      # evidence in a row, and fail loudly rather than sleeping a guessed interval.
      - name: wait for both deployments to serve everywhere
        run: |
          need=5
          for url in "$PROBE_URL" "$LIVE_URL"; do
            ok=0
            for i in $(seq 1 60); do
              code=$(curl -s -o /dev/null -m 10 -w '%{http_code}' "$url/" || echo 000)
              if [ "$code" = "200" ]; then ok=$((ok+1)); else ok=0; fi
              if [ "$ok" -ge "$need" ]; then echo "$url served $need consecutive probes after ${i}s"; break; fi
              if [ "$i" = "60" ]; then echo "$url never settled (last $code, streak $ok)"; exit 1; fi
              sleep 2
            done
          done

      # Has the runtime started doing natively what this package does in JavaScript?
      - name: node compatibility has not changed under us
        env:
          PROXY_1: ${{ secrets.TUNNELFETCH_PROXY }}
        run: node --test --test-reporter=spec "test/live/nodecompat.live.js"

      # Does the package still interoperate, measured where it runs rather than from a runner whose
      # network is not ours to trust?
      - name: the package still works end to end on the edge
        env:
          PROXY_1: ${{ secrets.TUNNELFETCH_PROXY }}
        run: node --test --test-reporter=spec "test/live/edge-interop.live.js"

      - name: remove the run's Workers
        if: always()
        run: node scripts/delete-worker.mjs "$PROBE_NAME" "$LIVE_NAME"

  trust-layer:
    # Separate job, and deliberately no Worker: these run from the runner straight through the
    # proxy. Splitting them means an outage at the misconfigured-TLS test site cannot mask a
    # capability change, and vice versa. Both must pass; neither may skip.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci

      # Real servers that are wrong in exactly one way each — expired, wrong host, self-signed,
      # untrusted root, incomplete chain. Every one must fail closed with its specific error code.
      # The suite includes a control that must SUCCEED, so a dead network fails the job instead of
      # quietly passing it.
      # No proxy and no secret: this dials the misconfigured hosts directly over node:net through
      # this package's own TLS stack, which is the thing under test. Setting TUNNELFETCH_PROXY would
      # tunnel instead, and is available locally for anyone whose network blocks the direct route.
      - name: certificate validation still fails closed against real bad servers
        run: node --test --test-reporter=spec "test/live/badssl.live.js"

      # Dates advance whether or not anyone commits, so the staleness assertion needs a trigger
      # that is not a commit.
      - name: bundled trust anchors are still fresh
        run: node --test --test-reporter=spec "test/trust/roots-freshness.test.js"
